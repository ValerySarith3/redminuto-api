# Visita la API cada 10 minutos para que Render (plan gratis) no la duerma
# y Aiven no apague la base de datos por inactividad.
name: Mantener API despierta

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://redminuto-api.onrender.com/api/health
